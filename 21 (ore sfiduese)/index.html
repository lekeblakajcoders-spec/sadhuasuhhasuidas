<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <title>Carousel Bootstrap</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="carousel.css">
</head>
<body>

<div class="container mt-5">
  <div id="myCarousel" class="carousel slide" data-bs-ride="carousel">

    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="https://picsum.photos/800/400?1" class="d-block w-100">
        <div class="carousel-caption">
          <h5>Imazhi 1</h5>
          <p>Përshkrimi i parë</p>
        </div>
      </div>

      <div class="carousel-item">
        <img src="https://picsum.photos/800/400?2" class="d-block w-100">
        <div class="carousel-caption">
          <h5>Imazhi 2</h5>
          <p>Përshkrimi i dytë</p>
        </div>
      </div>

      <div class="carousel-item">
        <img src="https://picsum.photos/800/400?3" class="d-block w-100">
        <div class="carousel-caption">
          <h5>Imazhi 3</h5>
          <p>Përshkrimi i tretë</p>
        </div>
      </div>
    </div>

    <button class="carousel-control-prev" type="button" data-bs-target="#myCarousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </button>

    <button class="carousel-control-next" type="button" data-bs-target="#myCarousel" data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
    </button>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
