<!doctype html>
<html lang="sq">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Interactive Card</title>
  <link rel="stylesheet" href="main.css" />
</head>
<body>
  <main class="page">
    <div class="card" tabindex="0" aria-label="Interactive information card">
      <div class="front">
        <h1 class="title">Interactive Card</h1>
        <p class="subtitle">Hover to learn more!</p>
      </div>

      <div class="overlay">
        <h2>More Information</h2>
        <p>This is a description that appears on hover. Add any content you like here — text, links or buttons.</p>
      </div>
    </div>
  </main>
</body>
</html>
